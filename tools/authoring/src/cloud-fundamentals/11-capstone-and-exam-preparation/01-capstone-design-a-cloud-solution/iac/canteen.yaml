AWSTemplateFormatVersion: '2010-09-09'
Description: Campus canteen pre-order capstone (DynamoDB + Lambda + alarm)
Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      Tags: [{Key: project, Value: canteen}]
  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: orders-rw
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: [dynamodb:PutItem, dynamodb:Scan], Resource: !GetAtt OrdersTable.Arn}]
  OrderFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt FnRole.Arn
      Timeout: 10
      Environment: {Variables: {TABLE: !Ref OrdersTable}}
      Code:
        ZipFile: |
          import json, os, uuid, boto3
          t = boto3.resource('dynamodb').Table(os.environ['TABLE'])
          def handler(e, c):
              m = e.get('requestContext', {}).get('http', {}).get('method', 'GET')
              if m == 'POST':
                  body = json.loads(e.get('body') or '{}')
                  item = {'id': str(uuid.uuid4()), 'dish': body.get('dish', 'thali')}
                  t.put_item(Item=item)
                  return {'statusCode': 201, 'body': json.dumps(item)}
              return {'statusCode': 200, 'body': json.dumps({'orders': t.scan(Select='COUNT')['Count']})}
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref OrderFn}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
Outputs:
  FunctionName: {Value: !Ref OrderFn}
  TableName: {Value: !Ref OrdersTable}
