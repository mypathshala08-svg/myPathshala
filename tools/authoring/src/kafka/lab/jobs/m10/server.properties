process.roles=broker,controller
node.id=1
controller.quorum.voters=1@sec1:9093
listeners=SECURE://:9095,CONTROLLER://:9093
advertised.listeners=SECURE://sec1:9095
listener.security.protocol.map=SECURE:SASL_SSL,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=SECURE
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.secure.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
ssl.keystore.location=/s/sec1.p12
ssl.keystore.type=PKCS12
ssl.keystore.password=brokerpass
ssl.truststore.location=/s/trust.p12
ssl.truststore.type=PKCS12
ssl.truststore.password=trustpass
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:admin;User:ANONYMOUS
allow.everyone.if.no.acl.found=false
log.dirs=/tmp/kraft-sec
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
