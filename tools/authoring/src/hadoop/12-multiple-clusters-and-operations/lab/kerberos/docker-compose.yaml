# Lab 12.5: a Kerberos KDC, a Kerberos-secured NameNode, and a client machine.
services:
  kdc:
    image: ubuntu:24.04
    hostname: kdc
    command: ["bash", "/lab/kdc.sh"]
    volumes: [./:/lab:ro, ./keytabs:/keytabs]
  nn-secure:
    image: apache/hadoop:3.5.0
    hostname: nn-secure
    command: ["bash", "-c", "until kinit -kt /keytabs/nn.keytab nn/nn-secure@LAB.MYPHATSHALA 2>/dev/null; do sleep 3; done; kdestroy; [ -d /tmp/hadoop-hadoop/dfs/name/current ] || hdfs namenode -format -force -nonInteractive; hdfs namenode"]
    env_file: [./config]
    # no ENSURE_NAMENODE_DIR: the image would format before the keytab exists; we format after the KDC is up
    environment: { KRB5_CONFIG: /lab/krb5.conf }
    volumes: [./:/lab:ro, ./keytabs:/keytabs:ro, ./krb5.conf:/etc/krb5.conf:ro]
    depends_on: [kdc]
  client:
    image: apache/hadoop:3.5.0
    hostname: client
    command: ["sleep", "infinity"]
    env_file: [./config]
    volumes: [./krb5.conf:/etc/krb5.conf:ro, ./keytabs:/keytabs:ro]
