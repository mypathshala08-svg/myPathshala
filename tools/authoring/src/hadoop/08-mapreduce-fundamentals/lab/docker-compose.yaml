# Lab 8: HDFS + YARN. Each worker runs a DataNode AND a NodeManager (so maps can be data-local).
x-hadoop: &hadoop
  image: apache/hadoop:3.5.0
  env_file: [./config]
services:
  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment: { ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name" }
  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
  historyserver:
    <<: *hadoop
    hostname: historyserver
    command: ["mapred", "historyserver"]
  worker1:
    <<: *hadoop
    hostname: worker1
    command: ["bash", "-c", "hdfs --daemon start datanode && yarn nodemanager"]
    depends_on: [namenode, resourcemanager]
  worker2:
    <<: *hadoop
    hostname: worker2
    command: ["bash", "-c", "hdfs --daemon start datanode && yarn nodemanager"]
    depends_on: [namenode, resourcemanager]
  worker3:
    <<: *hadoop
    hostname: worker3
    command: ["bash", "-c", "hdfs --daemon start datanode && yarn nodemanager"]
    depends_on: [namenode, resourcemanager]
