x-hadoop: &hadoop
  image: apache/hadoop:3.5.0
  env_file: [./config]
  volumes: [./nn.sh:/opt/nn.sh:ro, ./zk.sh:/opt/zk.sh:ro]
services:
  zk:  { <<: *hadoop, hostname: zk,  command: ["bash", "/opt/zk.sh"] }
  jn1: { <<: *hadoop, hostname: jn1, command: ["hdfs", "journalnode"] }
  jn2: { <<: *hadoop, hostname: jn2, command: ["hdfs", "journalnode"] }
  jn3: { <<: *hadoop, hostname: jn3, command: ["hdfs", "journalnode"] }
  nn1: { <<: *hadoop, hostname: nn1, command: ["bash", "/opt/nn.sh"], depends_on: [zk, jn1, jn2, jn3] }
  nn2: { <<: *hadoop, hostname: nn2, command: ["bash", "/opt/nn.sh"], depends_on: [nn1] }
  datanode: { <<: *hadoop, command: ["hdfs", "datanode"], depends_on: [nn1, nn2] }
