x-hadoop: &hadoop
  image: apache/hadoop:3.5.0
  env_file: [./config]
  volumes: [./nnf.sh:/opt/nnf.sh:ro, ./client-conf:/opt/client-conf]
services:
  nn-canteen:
    <<: *hadoop
    hostname: nn-canteen
    command: ["bash", "/opt/nnf.sh"]
    environment: { HDFS-SITE.XML_dfs.nameservice.id: nsc }
  nn-hostel:
    <<: *hadoop
    hostname: nn-hostel
    command: ["bash", "/opt/nnf.sh"]
    environment: { HDFS-SITE.XML_dfs.nameservice.id: nsh }
  datanode:
    <<: *hadoop
    command: ["hdfs", "datanode"]
    depends_on: [nn-canteen, nn-hostel]
