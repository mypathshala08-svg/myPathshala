# TiffinGo Spark 4.3.0 standalone cluster: 1 master, 2 workers, history server
x-spark: &spark
  image: tiffingo/spark:4.3.0
  volumes:
    - ./events:/opt/spark-events
    - ./data:/data
    - ./jobs:/jobs
  environment:
    SPARK_NO_DAEMONIZE: "true"
services:
  spark-master:
    <<: *spark
    hostname: spark-master
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports: ["7077:7077", "8090:8080"]
  spark-worker-1:
    <<: *spark
    hostname: spark-worker-1
    command: spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2g --webui-port 8081 spark://spark-master:7077
    ports: ["8091:8081"]
    depends_on: [spark-master]
  spark-worker-2:
    <<: *spark
    hostname: spark-worker-2
    command: spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2g --webui-port 8081 spark://spark-master:7077
    ports: ["8092:8081"]
    depends_on: [spark-master]
  spark-history:
    <<: *spark
    hostname: spark-history
    command: spark-class org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=/opt/spark-events"
    ports: ["18080:18080"]
